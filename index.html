<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>90's Card Game</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800;900&display=swap');

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    background:#02050b url("assets/stadium-bg.png") center center / 100% 100% no-repeat;
    color:#fff;
    font-family:'Barlow Condensed',Arial,sans-serif;
}

/* =========================================================
   COMPLETE GAME BOARD
   The background image itself is the visual board.
========================================================= */

#game{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
}


/* =========================================================
   TOP LIVE CONTROLS
========================================================= */

.exit{
    position:absolute;
    left:18.2%;
    top:4.0%;

    z-index:50;

    border:1px solid rgba(110,190,235,.35);
    border-radius:9px;

    padding:8px 16px;

    background:rgba(4,12,23,.88);
    color:#fff;

    font-family:'Barlow Condensed',sans-serif;
    font-weight:800;
    font-size:15px;

    cursor:pointer;

    box-shadow:
        0 4px 15px rgba(0,0,0,.35);

    transition:.2s;
}

.exit:hover{
    transform:translateY(-2px);
    border-color:#6fdcff;
    box-shadow:0 0 18px rgba(60,200,255,.35);
}


/* =========================================================
   LIVE SCORE COUNTERS
========================================================= */

.scores{
    position:absolute;

    right:17.8%;
    top:3.2%;

    display:flex;
    gap:9px;

    z-index:50;
}

.score{
    min-width:69px;

    padding:8px 12px;

    text-align:center;

    border:1px solid rgba(100,160,205,.32);
    border-radius:10px;

    background:rgba(4,12,23,.88);

    font-size:13px;
    font-weight:800;

    box-shadow:0 4px 15px rgba(0,0,0,.3);
}

.score b{
    color:#ffd94f;
    font-size:18px;
}


/* =========================================================
   LIVE PLAYER CARDS
========================================================= */

/*
   These coordinates are deliberately percentage based.

   They sit over the gold/red card frames already present
   inside stadium-bg.png.
*/

.card{
    position:absolute;

    top:23.15%;

    width:14.25%;
    height:43.4%;

    z-index:30;

    border-radius:16px;

    overflow:hidden;

    padding:7px;

    background:
        linear-gradient(
            145deg,
            rgba(5,12,21,.98),
            rgba(4,9,17,.98)
        );

    box-shadow:
        0 10px 30px rgba(0,0,0,.35);
}


/* LEFT CARD */

.card.you{
    left:29.15%;

    border:3px solid #e3ad2d;

    box-shadow:
        0 0 18px rgba(255,190,30,.25),
        inset 0 0 20px rgba(255,190,30,.08);
}


/* RIGHT CARD */

.card.cpu{
    left:48.55%;

    border:3px solid #e84b5b;

    box-shadow:
        0 0 18px rgba(255,40,65,.22),
        inset 0 0 20px rgba(255,40,65,.06);
}


/* =========================================================
   CARD CONTENT
========================================================= */

.card-top{
    height:7%;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 5px;

    color:#9bb7c7;

    font-size:7px;
    font-weight:900;

    letter-spacing:1.5px;
}

.player-image{
    display:block;

    width:100%;
    height:40%;

    object-fit:cover;
    object-position:center;

    border-radius:8px;

    background:
        radial-gradient(
            circle,
            #1b4567,
            #07111d 75%
        );
}

.player-title{
    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:6px;

    height:13%;

    padding:3px 2px;
}

.player-name{
    min-width:0;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;

    font-size:clamp(13px,1.25vw,22px);
    font-weight:900;

    line-height:1;
}

.page-button{
    width:27px;
    height:27px;

    flex-shrink:0;

    border-radius:50%;

    border:1px solid rgba(255,210,60,.55);

    background:rgba(10,17,27,.9);

    color:#ffd84d;

    font-size:16px;
    font-weight:900;

    cursor:pointer;

    transition:.18s;
}

.page-button:hover{
    transform:scale(1.08);
    box-shadow:0 0 14px rgba(255,210,60,.35);
}


/* =========================================================
   STATS
========================================================= */

.stats{
    height:40%;

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:5px;
}

.stat{
    min-width:0;

    border-radius:7px;

    padding:5px 7px;

    background:
        linear-gradient(
            145deg,
            rgba(18,27,39,.97),
            rgba(8,14,23,.97)
        );

    border:1px solid rgba(110,145,165,.15);

    position:relative;
}

.stat:before{
    content:"";

    position:absolute;

    left:0;
    top:5px;
    bottom:5px;

    width:2px;

    border-radius:4px;

    background:#36b4e7;
}

.stat-label{
    display:block;

    color:#6d8492;

    font-size:6px;
    font-weight:700;

    letter-spacing:.7px;
}

.stat-value{
    display:block;

    margin-top:1px;

    font-size:clamp(13px,1.15vw,19px);
    font-weight:900;

    line-height:1;
}

.cpu .stat-value{
    color:#93a5b0;
}


/* =========================================================
   VS
========================================================= */

.vs{
    position:absolute;

    left:44.8%;
    top:39.5%;

    width:5.2vw;
    height:5.2vw;

    max-width:67px;
    max-height:67px;

    min-width:45px;
    min-height:45px;

    z-index:35;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(255,214,70,.35),
            rgba(2,6,12,.82) 70%
        );

    border:1px solid rgba(255,220,70,.5);

    color:#fff;

    font-size:clamp(20px,2.3vw,34px);
    font-weight:900;

    text-shadow:
        0 0 10px rgba(255,255,255,.5);

    box-shadow:
        0 0 25px rgba(255,190,40,.25);
}


/* =========================================================
   CALL LABELS
========================================================= */

.call{
    position:absolute;

    top:20.2%;

    z-index:35;

    color:#fff;

    font-size:clamp(14px,1.35vw,22px);
    font-weight:900;

    text-align:center;

    text-shadow:0 2px 5px #000;
}

.call.you{
    left:29.1%;
    width:14.4%;
}

.call.cpu{
    left:48.5%;
    width:14.4%;
}


/* =========================================================
   STAT CALL AREA
========================================================= */

/*
   The background artwork already has the six stat buttons.
   These transparent live buttons are placed exactly over them.
*/

.stat-call{
    position:absolute;

    left:29.55%;
    top:71.45%;

    width:32.0%;
    height:7.0%;

    z-index:45;

    display:grid;

    grid-template-columns:repeat(6,1fr);

    gap:6px;
}

.stat-button{
    border:1px solid rgba(55,190,235,.3);
    border-radius:8px;

    background:rgba(3,15,25,.76);

    color:#fff;

    cursor:pointer;

    font-family:'Barlow Condensed',sans-serif;
    font-size:clamp(8px,.7vw,12px);
    font-weight:800;

    transition:.15s;
}

.stat-button:hover{
    transform:translateY(-2px);

    border-color:#6adfff;

    box-shadow:
        0 0 15px rgba(50,205,255,.3);
}

.stat-button.selected{
    border-color:#ffd84d;

    background:
        linear-gradient(
            145deg,
            rgba(100,70,10,.85),
            rgba(25,20,5,.9)
        );

    box-shadow:
        0 0 16px rgba(255,205,50,.4);
}


/* =========================================================
   RESULT MESSAGE
========================================================= */

.result{
    position:absolute;

    left:29%;
    width:34%;

    top:80.0%;

    z-index:45;

    min-height:28px;

    text-align:center;

    font-size:clamp(13px,1.2vw,20px);
    font-weight:900;

    letter-spacing:.7px;

    text-shadow:
        0 2px 8px #000;
}

.result.win{
    color:#ffe16a;
}

.result.loss{
    color:#ff6978;
}

.result.tie{
    color:#67d9ff;
}


/* =========================================================
   PAGE INDICATOR
========================================================= */

.page-indicator{
    position:absolute;

    left:29.2%;
    top:67.2%;

    width:14%;

    z-index:40;

    text-align:center;

    font-size:8px;
    font-weight:800;

    letter-spacing:1px;

    color:rgba(210,235,245,.55);
}


/* =========================================================
   BATTLE SHAKE
========================================================= */

@keyframes shake{
    0%,100%{
        transform:translateX(0);
    }

    20%{
        transform:translateX(-5px);
    }

    40%{
        transform:translateX(5px);
    }

    60%{
        transform:translateX(-4px);
    }

    80%{
        transform:translateX(4px);
    }
}

.shake{
    animation:shake .4s ease;
}


/* =========================================================
   WIN GLOW
========================================================= */

@keyframes winnerGlow{
    0%,100%{
        filter:brightness(1);
    }

    50%{
        filter:brightness(1.4);
    }
}

.winner{
    animation:winnerGlow .7s ease 2;
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:900px){

    body{
        overflow:auto;

        background-size:auto 100%;
        background-position:center top;
    }

    #game{
        min-width:900px;
        height:100vh;
    }
}
</style>
</head>

<script>

/* ============================================================
   SOUND
============================================================ */

let audioContext = null;

function sound(
    frequency = 440,
    duration = 0.07,
    type = "square"
){

    try{

        if(!audioContext){

            audioContext =
                new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )();

        }

        const oscillator =
            audioContext.createOscillator();

        const gain =
            audioContext.createGain();

        oscillator.type = type;

        oscillator.frequency.value =
            frequency;

        gain.gain.setValueAtTime(
            0.045,
            audioContext.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            0.001,
            audioContext.currentTime + duration
        );

        oscillator.connect(gain);

        gain.connect(
            audioContext.destination
        );

        oscillator.start();

        oscillator.stop(
            audioContext.currentTime + duration
        );

    }catch(e){}

}


/* ============================================================
   PLAYER DATA
   ============================================================ */

const players = [

    {
        name:"Sachin Tendulkar",
        country:"India",
        image:"https://upload.wikimedia.org/wikipedia/commons/2/25/Sachin_Tendulkar_at_MRF_Promotion_Event.jpg",

    },

        stats:{

        }
    },

    {
        name:"Brian Lara",
        country:"West Indies",
        image:"",

        stats:{
            matches:299,

        }
    },

    {

        country:"Pakistan",
        image:"",

        stats:{
            matches:356,
            runs:3717,
            average:16.52,
            strikeRate:88.33,
            highScore:86,
            hundreds:0,

            wickets:502,
            bowlAverage:23.52,
            fiveW:6,
            catches:88,
            stumpings:0,
            fifties:6
        }
    }

];


/* ============================================================
   STAT PAGES
============================================================ */

const battingStats = [

    ["matches","MATCHES"],
    ["runs","RUNS"],
    ["average","AVERAGE"],
    ["strikeRate","STRIKE RATE"],
    ["highScore","HIGH SCORE"],
    ["hundreds","100'S"]

];

const bowlingStats = [

    ["wickets","WICKETS"],
    ["bowlAverage","BOWL AVERAGE"],
    ["fiveW","5W HAUL"],
    ["catches","CATCHES"],
    ["stumpings","STUMPING"],
    ["fifties","50'S"]

];


/* ============================================================
   GAME STATE
============================================================ */

let yourCard =
    players[0];

let cpuCard =
    players[1];

let yourPage = 0;
let cpuPage = 0;

let yourCards = 25;
let cpuCards = 25;

let previousCaller = "you";

let locked = false;


/* ============================================================
   NUMBER FORMAT
============================================================ */

function formatNumber(value){

    if(
        typeof value === "number" &&
        !Number.isInteger(value)
    ){

        return value.toFixed(2);

    }

    return Number(value).toLocaleString("en-IN");

}


/* ============================================================
   IMAGE
============================================================ */

function loadImage(element,player){

    if(player.image){

        element.src =
            player.image;

    }else{

        element.src =
            "https://dummyimage.com/800x500/07111d/69d9ff&text=" +
            encodeURIComponent(player.name);

    }

    element.onerror = function(){

        this.onerror = null;

        this.src =
            "https://dummyimage.com/800x500/07111d/69d9ff&text=" +
            encodeURIComponent(player.name);

    };

}


/* ============================================================
   RENDER STATS
============================================================ */

function renderStats(side){

    const player =
        side === "you"
            ? yourCard
            : cpuCard;

    const page =
        side === "you"
            ? yourPage
            : cpuPage;

    const container =
        document.getElementById(
            side === "you"
                ? "yourStats"
                : "cpuStats"
        );

    const list =
        page === 0
            ? battingStats
            : bowlingStats;

    container.innerHTML = "";

    list.forEach(
        ([key,label]) => {

            const value =
                player.stats[key] ?? 0;

            const stat =
                document.createElement("div");

            stat.className =
                "stat";

            stat.innerHTML = `

                <span class="stat-label">
                    ${label}
                </span>

                <span class="stat-value">
                    ${
                        side === "cpu"
                            ? "?"
                            : formatNumber(value)
                    }
                </span>

            `;

            container.appendChild(stat);

        }
    );

}


/* ============================================================
   PAGE SWITCH
============================================================ */

function switchPage(side){

    sound(650,.06,"triangle");

    if(side === "you"){

        yourPage =
            yourPage === 0
                ? 1
                : 0;

    }else{

        cpuPage =
            cpuPage === 0
                ? 1
                : 0;

    }

    renderStats(side);

    updatePageIndicator();

}


/* ============================================================
   PAGE INDICATOR
============================================================ */

function updatePageIndicator(){

    document.getElementById(
        "pageIndicator"
    ).textContent =
        yourPage === 0
            ? "BATTING STATS"
            : "BOWLING / FIELDING";

}


/* ============================================================
   RENDER PLAYER
============================================================ */

function renderPlayer(){

    document.getElementById(
        "yourName"
    ).textContent =
        yourCard.name.toUpperCase();

    document.getElementById(
        "cpuName"
    ).textContent =
        cpuCard.name.toUpperCase();

    document.getElementById(
        "yourCountry"
    ).textContent =
        yourCard.country.toUpperCase();

    document.getElementById(
        "cpuCountry"
    ).textContent =
        cpuCard.country.toUpperCase();


    loadImage(
        document.getElementById("yourImage"),
        yourCard
    );

    loadImage(
        document.getElementById("cpuImage"),
        cpuCard
    );


    renderStats("you");
    renderStats("cpu");

    updatePageIndicator();

}


/* ============================================================
   COUNTERS
============================================================ */

function updateCounters(){

    document.getElementById(
        "youCount"
    ).textContent =
        yourCards;

    document.getElementById(
        "cpuCount"
    ).textContent =
        cpuCards;

}


/* ============================================================
   GAME RULE
============================================================ */

function compare(
    playerValue,
    opponentValue,
    stat
){

    playerValue =
        Number(playerValue) || 0;

    opponentValue =
        Number(opponentValue) || 0;


    /*
       ZERO ALWAYS LOSES
    */

    if(
        playerValue === 0 &&
        opponentValue === 0
    ){

        return 0;

    }


    if(playerValue === 0){

        return -1;

    }


    if(opponentValue === 0){

        return 1;

    }


    /*
       BOWLING AVERAGE
       LOWER NON-ZERO WINS
    */

    if(stat === "bowlAverage"){

        if(
            playerValue <
            opponentValue
        ){

            return 1;

        }

        if(
            playerValue >
            opponentValue
        ){

            return -1;

        }

        return 0;

    }


    /*
       EVERYTHING ELSE
       HIGHER WINS
    */

    if(
        playerValue >
        opponentValue
    ){

        return 1;

    }

    if(
        playerValue <
        opponentValue
    ){

        return -1;

    }

    return 0;

}


/* ============================================================
   RESULT
============================================================ */

function showResult(
    result,
    stat
){

    const resultBox =
        document.getElementById(
            "result"
        );

    const yourValue =
        yourCard.stats[stat] ?? 0;

    const cpuValue =
        cpuCard.stats[stat] ?? 0;


    document
        .getElementById("yourCard")
        .classList.remove("shake");

    document
        .getElementById("cpuCard")
        .classList.remove("shake");


    void document
        .getElementById("yourCard")
        .offsetWidth;


    document
        .getElementById("yourCard")
        .classList.add("shake");

    document
        .getElementById("cpuCard")
        .classList.add("shake");


    if(result > 0){

        resultBox.className =
            "result win";

        resultBox.textContent =
            `YOU WIN — ${formatNumber(yourValue)} vs ${formatNumber(cpuValue)}`;

        sound(760,.12,"sine");

    }

    else if(result < 0){

        resultBox.className =
            "result loss";

        resultBox.textContent =
            `CPU WINS — ${formatNumber(yourValue)} vs ${formatNumber(cpuValue)}`;

        sound(180,.16,"sawtooth");

    }

    else{

        resultBox.className =
            "result tie";

        resultBox.textContent =
            `TIE — ${formatNumber(yourValue)} vs ${formatNumber(cpuValue)}`;

        sound(440,.1,"triangle");

    }

}


/* ============================================================
   CALL STAT
============================================================ */

function callStat(stat){

    if(locked){
        return;
    }

    locked = true;

    sound(520,.08,"square");


    document
        .querySelectorAll(".stat-button")
        .forEach(
            button =>
                button.classList.remove(
                    "selected"
                )
        );


    const order = [

        "matches",
        "runs",
        "average",
        "strikeRate",
        "highScore",
        "hundreds"

    ];

    const index =
        order.indexOf(stat);


    if(index >= 0){

        document
            .querySelectorAll(".stat-button")
            [index]
            .classList.add("selected");

    }


    document.getElementById(
        "cpuCall"
    ).textContent =
        "REVEALING";


    setTimeout(

        () => {

            const result =
                compare(
                    yourCard.stats[stat],
                    cpuCard.stats[stat],
                    stat
                );


            showResult(
                result,
                stat
            );


            resolveRound(
                result
            );

        },

        500

    );

}


/* ============================================================
   RESOLVE ROUND
============================================================ */

function resolveRound(result){

    if(result > 0){

        cpuCards =
            Math.max(
                0,
                cpuCards - 1
            );

        yourCards++;

        previousCaller =
            "you";

    }

    else if(result < 0){

        yourCards =
            Math.max(
                0,
                yourCards - 1
            );

        cpuCards++;

        previousCaller =
            "cpu";

    }

    /*
       TIE:
       card counts do not change.
       previous caller remains.
    */


    updateCounters();


    /*
       Winner / previous caller gets next call.
    */

    setTimeout(

        () => {

            if(
                yourCards <= 0 ||
                cpuCards <= 0
            ){

                finishGame();

                return;

            }


            /*
               Demo card rotation.
               This will be replaced by the
               complete 90-card deck when the
               full player database is connected.
            */

            const shuffled =
                players
                    .slice()
                    .sort(
                        () =>
                            Math.random() - .5
                    );


            yourCard =
                shuffled[0];

            cpuCard =
                shuffled[1];


            yourPage = 0;
            cpuPage = 0;


            renderPlayer();


            document.getElementById(
                "cpuCall"
            ).textContent =
                previousCaller === "you"
                    ? "WAITING"
                    : "YOUR TURN";


            document
                .querySelectorAll(
                    ".stat-button"
                )
                .forEach(
                    button =>
                        button.classList.remove(
                            "selected"
                        )
                );


            document.getElementById(
                "result"
            ).textContent = "";


            locked = false;

        },

        1400

    );

}


/* ============================================================
   GAME OVER
============================================================ */

function finishGame(){

    const result =
        document.getElementById(
            "result"
        );

    if(yourCards <= 0){

        result.className =
            "result loss";

        result.textContent =
            "CPU WINS THE GAME!";

    }else{

        result.className =
            "result win";

        result.textContent =
            "YOU WIN THE GAME!";

    }

}


/* ============================================================
   GLOBAL BUTTON SOUND
============================================================ */

document.addEventListener(
    "click",
    event => {

        if(
            event.target.tagName ===
            "BUTTON"
        ){

            /*
               Page/stat buttons already
               have their own sounds,
               but this keeps every click audible.
            */

        }

    }
);


/* ============================================================
   INITIALIZE
============================================================ */

renderPlayer();

updateCounters();

updatePageIndicator();

</script>
